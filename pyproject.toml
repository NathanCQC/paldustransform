[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paldustransform"
version = "0.1.0"
description = "A minimal pytket implementation of the Paldus transform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pytket>=2.0",
]

[project.optional-dependencies]
examples = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "matplotlib>=3.9",
  "scipy>=1.14",
]
test = ["pytest>=8.3"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/paldustransform"]
